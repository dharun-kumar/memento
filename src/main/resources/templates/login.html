<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memento — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow p-4" style="max-width:400px;width:100%">
        <h4 class="mb-3">Memento</h4>

        <!-- Shown when Spring Security rejects credentials (?error) -->
        <div th:if="${error}" class="alert alert-danger py-2">Invalid username or password.</div>

        <!-- Shown after a successful logout (?logout) -->
        <div th:if="${logout}" class="alert alert-success py-2">You have been logged out.</div>

        <!-- POST /login is handled by Spring Security's UsernamePasswordAuthenticationFilter -->
        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
    </div>
</body>
</html>
