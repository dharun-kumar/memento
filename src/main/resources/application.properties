spring.application.name=memento

# =============================================================================
# SERVER  (spring-boot-starter-webmvc)
# Tomcat is the embedded web server Spring Boot starts automatically —
# no separate server installation needed.
# =============================================================================

# Reject oversized request bodies to prevent abuse / accidental large uploads
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1MB

# Graceful shutdown: on SIGTERM, stop accepting new requests but wait up to
# 20 seconds for in-flight requests to finish before the process exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# =============================================================================
# DATABASE  (spring-boot-starter-data-jpa + postgresql)
# Spring Boot auto-configures a DataSource from these properties.
# Values are read from environment variables; the part after ':' is the
# fallback used in local dev when no env var is set.
#
# In Docker the DB hostname is the service name ("db") from docker-compose.yml,
# not localhost — that's why SPRING_DATASOURCE_URL is overridden there.
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memento}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:memento}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:memento123}

# Hibernate must never auto-create or alter tables — Flyway owns all schema changes
spring.jpa.hibernate.ddl-auto=none

# HikariCP is the connection pool Spring Boot uses by default.
# A pool holds open DB connections so each request doesn't pay the cost of
# creating a new one. Keep small on a 1 GB VPS (Postgres default max = 100).
spring.datasource.hikari.maximum-pool-size=3
# Minimum connections kept open even when idle
spring.datasource.hikari.minimum-idle=1
# How long (ms) to wait for a free connection before throwing an error
spring.datasource.hikari.connection-timeout=20000
# How long (ms) an idle connection is kept before being closed
spring.datasource.hikari.idle-timeout=300000

# =============================================================================
# RATE LIMITING  (bucket4j-core)
# Each unique IP address gets its own token bucket.
# Note: this is per MINUTE, not per second.
# capacity      — max burst (how many requests can fire back-to-back before throttling)
# refill/minute — steady-state rate after burst is used up
# For a personal app with AI agents: 15/min (1 request every 4 seconds) is enough.
# Raise if agents need to make rapid sequential calls.
# =============================================================================
app.rate-limit.capacity=15
app.rate-limit.refill-per-minute=15

# =============================================================================
# JWT  (jjwt-api)
# The secret is used to sign every token — anyone with it can forge tokens.
# Never commit a real secret. Generate for production: openssl rand -base64 32
# Set it as an environment variable: JWT_SECRET=<your-value>
# The fallback below is only for local dev.
# =============================================================================
app.jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleVRoYXRJc0xvbmdFbm91Z2gxMjM0NTY=}
# How long a token stays valid — 86400000 ms = 24 hours
app.jwt.expiration-ms=86400000

# =============================================================================
# CACHE  (spring-boot-starter-cache + caffeine)
# Caffeine is an in-memory cache — entries live in the JVM heap and are lost
# on restart. Good for frequently-read, rarely-changed data like bookmarks.
# =============================================================================
spring.cache.type=caffeine
# maximumSize: evict oldest when 500 entries are reached
# expireAfterWrite: remove an entry 10 minutes after it was written
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# =============================================================================
# ACTUATOR  (spring-boot-starter-actuator)
# Provides /actuator/health and /actuator/info — useful for Docker health
# checks and uptime monitors. Everything else is intentionally disabled.
# =============================================================================
management.endpoints.web.exposure.include=health,info
# Never show DB/disk details in the public health response
management.endpoint.health.show-details=never

# =============================================================================
# OPENAPI / SWAGGER  (springdoc-openapi-starter-webmvc-ui)
# Swagger UI is auto-generated from your @RestController classes at startup.
# Visit: http://localhost:8080/swagger-ui/index.html
# =============================================================================
# Only document /api/** — login, auth/token, and actuator are excluded
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui/index.html

# =============================================================================
# LOGGING
# Logs go to both console (default) and a rolling file on disk.
# In Docker, the log directory is mounted as a volume so logs survive restarts.
# =============================================================================
logging.file.name=/var/log/memento/app.log

# Split into a new file when the current one hits 10 MB
logging.logback.rollingpolicy.max-file-size=10MB
# Keep the last 30 days of rotated files
logging.logback.rollingpolicy.max-history=30
# Hard cap on total log storage — delete oldest files if exceeded
logging.logback.rollingpolicy.total-size-cap=200MB

# INFO logs everything important; change com.memento to DEBUG when troubleshooting
logging.level.root=INFO
logging.level.com.memento=INFO
